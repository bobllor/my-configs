// -- general settings --
sensitivity 1.6
zoom_sensitivity_ratio 1.1
// removes everything but the triangle of a teammate
// 2 for full kit + health
cl_teamid_overhead_mode 1
volume .15
// disables smooth camera in spectator
sv_disable_observer_interpolation true

// -- general binds --
bind f8 disconnect
bind z player_ping
bind mwheelup +jump
// commented because for some reason i keep hitting this while holding my mouse
// bind mwheeldown +jump
// remove binds from my practice exec
bind mouse3 ""	

// -- grenade binds --
// slot7 -> flashbang
// slot8 -> smoke
// slot10 -> molotov
bind mouse5 slot7
bind c slot8
bind x slot10

// -- radar --
cl_radar_scale .4
cl_radar_always_centered false
cl_radar_rotate true

// -- viewmodel --
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 0.5
viewmodel_offset_z -2

// -- crosshair --
cl_crosshairgap -4
cl_crosshairsize 1
cl_crosshairthickness .5
cl_crosshair_drawoutline true
cl_crosshair_recoil false
cl_crosshaircolor 1
cl_crosshairstyle 4